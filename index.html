<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>WebDisplays Random YT Player</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- The video player -->
    <iframe id="player" allow="autoplay" allowfullscreen></iframe>

    <script>
      // === CONFIG ZONE ===

      const videoIDs = [
        "CleUrqPLCzU",
        "1hoSYvwnv_E",
        "A5eIRDPUx_k",
        "ISfNviwVs_A",
        "z-TUOiJVaYk",
        "TH0ZXfmjRqE",
        "vl4XOzGxLDk",
        "CjbGeoQV7Lk",
        "b_VRJa9rjso",
        "XOhLf-6EwEg",
        "dzudQVAVVQ0",
        "qtwz81uG47k",
        "Frtax3pXPtg",
        "mBCVeX0mXBw",
        "U3p21FI9WBw",
        "DXfCYUYDdcA",
        "ESXkzitisLc",
        "CYtaz0URX4c",
        "CNeW3BbZc9Q",
        "JvMoBwtBN6U",
        "tFPcx4X9-e8",
        "N3bHFs-gKr4",
        "ZeGLH-OzWho"
      ];

      const commonParams = "&autoplay=1&mute=1&cc_load_policy=1";

      // Pick a random video ID
      const rand = videoIDs[Math.floor(Math.random() * videoIDs.length)];

      // Log to console so you can verify randomness
      console.log(`🎯 Selected video ID: ${rand}`);

      // Build the YouTube embed URL
      const url = `https://www.youtube.com/embed/${rand}?playlist=${rand}${commonParams}`;

      // Set the video in the iframe
      document.getElementById("player").src = url;
    </script>
  </body>
</html>
