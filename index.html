<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>WebDisplays Playlist Randomizer v1.3</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <iframe 
      id="player" 
      allow="autoplay" 
      allowfullscreen 
      src="https://www.youtube.com/embed/videoseries?list=PLnVrQgGuTfZ_JEkI6ieqFE6Sox12YnRAt&autoplay=1&mute=1&cc_load_policy=1&enablejsapi=1">
    </iframe>

    <script>
      // === CONFIG ZONE ===
      const version = "v1.4";
      const numVideos = 23; // Total videos in your playlist

      console.log(`🎬 WebDisplays Playlist Randomizer ${version}`);

      const skipClicks = Math.floor(Math.random() * numVideos);
      console.log(`🔀 Will skip ahead by ${skipClicks} video(s)`);

      const delay = 5000; // 5 seconds to let player load
      const pausePlayDelay = 3000; // Time after skips to fake user click

      function skipVideos() {
        const iframe = document.getElementById("player");
        const iframeWindow = iframe.contentWindow;

        for (let i = 0; i < skipClicks; i++) {
          iframeWindow.postMessage(
            JSON.stringify({
              event: "command",
              func: "nextVideo",
              args: []
            }),
            "*"
          );
        }

        console.log(`✅ Skip commands sent (${skipClicks} times)`);

        // Try to "fake click" by pausing and playing
        setTimeout(() => {
          console.log(`🖱️ Faking pause and play to activate user event`);

          iframeWindow.postMessage(
            JSON.stringify({
              event: "command",
              func: "pauseVideo",
              args: []
            }),
            "*"
          );

          setTimeout(() => {
            iframeWindow.postMessage(
              JSON.stringify({
                event: "command",
                func: "playVideo",
                args: []
              }),
              "*"
            );
            console.log(`▶️ Play triggered — user interaction faked.`);
          }, 500); // Half a second after pause

        }, pausePlayDelay);
      }

      setTimeout(skipVideos, delay);
    </script>
  </body>
</html>
