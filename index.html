<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>WebDisplays Playlist Randomizer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      iframe {
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <iframe 
      id="player" 
      allow="autoplay" 
      allowfullscreen 
      src="https://www.youtube.com/embed/videoseries?list=PLnVrQgGuTfZ_JEkI6ieqFE6Sox12YnRAt&autoplay=1&mute=1&cc_load_policy=1">
    </iframe>

    <script>
      const numVideos = 23; // Total videos in your playlist

      // Random number of skips: 0 to numVideos - 1
      const skipClicks = Math.floor(Math.random() * numVideos);
      console.log(`🔀 Skipping ahead by ${skipClicks} video(s)`);

      const delay = 5000; // 5 seconds to let player load (adjust if needed)

      function skipVideos() {
        const iframe = document.getElementById("player");
        const iframeWindow = iframe.contentWindow;

        for (let i = 0; i < skipClicks; i++) {
          // Send YouTube player command to skip to next video
          iframeWindow.postMessage('{"event":"command","func":"nextVideo","args":""}', '*');
        }
      }

      // Wait before skipping to ensure player has loaded
      setTimeout(skipVideos, delay);
    </script>
  </body>
</html>
